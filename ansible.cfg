[defaults]
inventory = inventory.yml
nocows = true
collections_path = ~/.ansible/collections
vars_plugins_enabled = host_group_vars,community.sops.sops

# setup.yml is ~108 separate plays against the same host, so facts get
# re-gathered ~108 times per run. Cache them so only the first play pays.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts
fact_caching_timeout = 7200

[ssh_connection]
# Removes one SSH round trip per task. With ~340 tasks per run this is the
# single largest saving available -- most of setup.yml's time is spent in
# per-task overhead, not in any individual install.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey

[community.sops]
age_keyfile = ~/.config/sops/age/keys.txt
