---
- name: Install ChatGPT Desktop
  hosts: with_gui_tools:&with_ai_tools
  gather_facts: true

  vars:
    # Upstream (lencx/ChatGPT) has published nothing since v1.1.0 in Aug 2023,
    # so this is both the pinned and the latest version. The machinery below is
    # still version-aware so a bump would actually take effect.
    chatgpt_version: "1.1.0"
    chatgpt_checksum: "sha256:f2a1e3699f797086e57a92258de46722f09f6802c5fc5a9d0d54813e6fd2f04b"

  tasks:
    - name: Install ChatGPT Desktop via Homebrew (macOS)
      ansible.builtin.shell: /opt/homebrew/bin/brew install --cask chatgpt
      args:
        creates: /Applications/ChatGPT.app
      when: ansible_facts['os_family'] == "Darwin"
      tags: system

    # An AppImage exposes no version, so the installed version is recorded in
    # a stamp file beside it. Missing stamp (or an older one) means install.
    - name: Read installed ChatGPT Desktop version (Linux)
      ansible.builtin.slurp:
        src: /opt/chatgpt-desktop/.version
      register: chatgpt_stamp
      failed_when: false
      check_mode: false
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"]

    - name: Determine whether ChatGPT Desktop needs installing (Linux)
      ansible.builtin.set_fact:
        chatgpt_needed: >-
          {{ (chatgpt_stamp.content | default('') | b64decode | trim) != chatgpt_version }}
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"]

    - name: Download ChatGPT Desktop AppImage tarball (Linux)
      ansible.builtin.get_url:
        url: >-
          https://github.com/lencx/ChatGPT/releases/download/v{{ chatgpt_version }}/ChatGPT_{{ chatgpt_version }}_linux_x86_64.AppImage.tar.gz
        dest: /tmp/ChatGPT.AppImage.tar.gz
        mode: "0644"
        checksum: "{{ chatgpt_checksum }}"
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and chatgpt_needed | bool

    - name: Extract ChatGPT Desktop AppImage (Linux)
      ansible.builtin.unarchive:
        src: /tmp/ChatGPT.AppImage.tar.gz
        dest: /tmp
        remote_src: true
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and chatgpt_needed | bool

    - name: Create ChatGPT Desktop directory (Linux)
      ansible.builtin.file:
        path: /opt/chatgpt-desktop
        state: directory
        mode: "0755"
      become: true
      tags: system
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and chatgpt_needed | bool

    - name: Install ChatGPT Desktop AppImage (Linux)
      ansible.builtin.copy:
        src: /tmp/chat-gpt_{{ chatgpt_version }}_amd64.AppImage
        dest: /opt/chatgpt-desktop/chatgpt
        mode: "0755"
        remote_src: true
      become: true
      tags: system
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and chatgpt_needed | bool

    - name: Record installed ChatGPT Desktop version (Linux)
      ansible.builtin.copy:
        content: "{{ chatgpt_version }}\n"
        dest: /opt/chatgpt-desktop/.version
        mode: "0644"
      become: true
      tags: system
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and chatgpt_needed | bool

    - name: Create ChatGPT Desktop symlink (Linux)
      ansible.builtin.file:
        src: /opt/chatgpt-desktop/chatgpt
        dest: /usr/local/bin/chatgpt
        state: link
      become: true
      tags: system
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"]

    - name: Create ChatGPT Desktop .desktop file (Linux)
      ansible.builtin.copy:
        dest: /usr/share/applications/chatgpt-desktop.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=ChatGPT
          Comment=ChatGPT Desktop Application
          Exec=/opt/chatgpt-desktop/chatgpt --no-sandbox
          Icon=chat-gpt
          Terminal=false
          Type=Application
          Categories=Network;Chat;
          StartupWMClass=chat-gpt
      become: true
      tags: system
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"]
