---
- name: Install Claude Code
  hosts: with_ai_tools
  gather_facts: true

  tasks:
    - name: Install Claude Code via native installer
      ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash

    - name: Create zsh config directory
      ansible.builtin.file:
        path: ~/.config/zsh
        state: directory

    - name: Install claude-code aliases
      ansible.builtin.copy:
        src: claude-code.zsh
        dest: ~/.config/zsh/claude-code.zsh

    - name: Source claude-code aliases in zshrc
      ansible.builtin.lineinfile:
        path: ~/.zshrc
        line: "source ~/.config/zsh/claude-code.zsh"
        create: true

    - name: Ensure ~/.config/claude-code exists
      ansible.builtin.file:
        path: ~/.config/claude-code
        state: directory

    - name: Install .worktreeinclude example
      ansible.builtin.copy:
        src: worktreeinclude.example
        dest: ~/.config/claude-code/worktreeinclude.example

    - name: Ensure ~/.claude exists
      ansible.builtin.file:
        path: ~/.claude
        state: directory

    - name: Install global CLAUDE.md
      ansible.builtin.copy:
        src: CLAUDE.md
        dest: ~/.claude/CLAUDE.md

    - name: Install Claude Code statusline script
      ansible.builtin.copy:
        src: statusline.sh
        dest: ~/.claude/statusline.sh
        mode: "0755"

    - name: Ensure ~/.claude/scripts exists
      ansible.builtin.file:
        path: ~/.claude/scripts
        state: directory
        mode: "0755"

    - name: Ensure ~/.claude/skills exists
      ansible.builtin.file:
        path: ~/.claude/skills
        state: directory
        mode: "0755"

    # Skill sources were removed from this repo in ef3b85e (remove-old-skills).
    # These tasks purge any copies left on managed hosts.
    - name: Remove existing skill-creator skill
      ansible.builtin.file:
        path: ~/.claude/skills/skill-creator
        state: absent

    - name: Remove existing create-pr skill
      ansible.builtin.file:
        path: ~/.claude/skills/create-pr
        state: absent

    - name: Remove existing merge-pr skill
      ansible.builtin.file:
        path: ~/.claude/skills/merge-pr
        state: absent

    # Hook sources (git-blocker, hosts-blocker) were removed from this repo.
    # These tasks purge any copies left on managed hosts.
    - name: Remove existing PreToolUse hook scripts
      ansible.builtin.file:
        path: "~/.claude/hooks/{{ item }}"
        state: absent
      loop:
        - git-blocker.sh
        - hosts-blocker.sh

    - name: Ensure ~/.claude/settings.json exists
      ansible.builtin.copy:
        content: "{}\n"
        dest: ~/.claude/settings.json
        force: false

    - name: Remove blocker hook entries from ~/.claude/settings.json
      ansible.builtin.shell: |
        set -e
        settings="$HOME/.claude/settings.json"
        has_entry=$(jq -r '
          (.hooks.PreToolUse // [])
          | map(select((.hooks // []) | map(.command) | any(
              contains("git-blocker.sh") or contains("hosts-blocker.sh")
            )))
          | length
        ' "$settings")
        if [ "$has_entry" != "0" ]; then
          tmp=$(mktemp)
          jq '
            .hooks.PreToolUse |= map(select((.hooks // []) | map(.command) | any(
              contains("git-blocker.sh") or contains("hosts-blocker.sh")
            ) | not))
            | if (.hooks.PreToolUse | length) == 0 then del(.hooks.PreToolUse) else . end
          ' "$settings" > "$tmp"
          mv "$tmp" "$settings"
          echo CHANGED
        fi
      register: claude_blocker_unwire
      changed_when: "'CHANGED' in claude_blocker_unwire.stdout"

    - name: Wire statusline into ~/.claude/settings.json
      ansible.builtin.shell: |
        set -e
        settings="$HOME/.claude/settings.json"
        target_cmd="$HOME/.claude/statusline.sh"
        current=$(jq -r '.statusLine.command // ""' "$settings")
        if [ "$current" != "$target_cmd" ]; then
          tmp=$(mktemp)
          jq --arg cmd "$target_cmd" \
             '.statusLine = {"type": "command", "command": $cmd}' \
             "$settings" > "$tmp"
          mv "$tmp" "$settings"
          echo CHANGED
        fi
      register: claude_statusline_wire
      changed_when: "'CHANGED' in claude_statusline_wire.stdout"

    - name: Disable the Artifact tool in ~/.claude/settings.json
      ansible.builtin.shell: |
        set -e
        settings="$HOME/.claude/settings.json"
        current=$(jq -r '.disableArtifact' "$settings")
        if [ "$current" != "true" ]; then
          tmp=$(mktemp)
          jq '.disableArtifact = true' "$settings" > "$tmp"
          mv "$tmp" "$settings"
          echo CHANGED
        fi
      register: claude_artifact_wire
      changed_when: "'CHANGED' in claude_artifact_wire.stdout"

    - name: Disable auto-memory in ~/.claude/settings.json
      ansible.builtin.shell: |
        set -e
        settings="$HOME/.claude/settings.json"
        current=$(jq -r '.autoMemoryEnabled' "$settings")
        if [ "$current" != "false" ]; then
          tmp=$(mktemp)
          jq '.autoMemoryEnabled = false' "$settings" > "$tmp"
          mv "$tmp" "$settings"
          echo CHANGED
        fi
      register: claude_automemory_wire
      changed_when: "'CHANGED' in claude_automemory_wire.stdout"
