---
- name: Install DigitalOcean CLI
  hosts: all
  gather_facts: true

  vars:
    doctl_version: "1.166.0"

  tasks:
    - name: Install doctl via Homebrew
      ansible.builtin.shell: /opt/homebrew/bin/brew install doctl
      args:
        creates: /opt/homebrew/bin/doctl
      when: ansible_facts['os_family'] == "Darwin"
      tags: system

    # Version-aware so bumping doctl_version actually upgrades the host.
    - name: Check installed doctl version (Debian)
      ansible.builtin.command: /usr/local/bin/doctl version
      register: doctl_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Download and install doctl (Debian)
      ansible.builtin.shell: |
        curl -sL https://github.com/digitalocean/doctl/releases/download/v{{ doctl_version }}/doctl-{{ doctl_version }}-linux-amd64.tar.gz | tar xz -C /tmp
        install /tmp/doctl /usr/local/bin
        rm -f /tmp/doctl
      become: true
      tags: system
      when: >-
        ansible_facts['os_family'] == "Debian"
        and ("doctl version " ~ doctl_version) not in (doctl_installed.stdout | default(""))

    - name: Install doctl via yay (Arch)
      ansible.builtin.shell: yay -S --noconfirm doctl
      args:
        creates: /usr/bin/doctl
      when: ansible_facts['os_family'] == "Archlinux"
      tags: system
