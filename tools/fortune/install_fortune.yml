---
- name: Install fortune
  hosts: all
  gather_facts: true

  tasks:
    - name: Install fortune (macOS)
      community.general.homebrew:
        name: fortune
        state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Install fortune (Debian/Ubuntu)
      ansible.builtin.apt:
        name: fortune-mod
        state: present
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Debian"

    - name: Install fortune (Arch)
      community.general.pacman:
        name: fortune-mod
        state: present
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Archlinux"

    # Writes into the shared Homebrew prefix, so it is admin-only even though
    # it needs no become — a standard account cannot write /opt/homebrew.
    - name: Install kanye fortune (macOS)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /opt/homebrew/share/games/fortunes/
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/kanye"
        - "{{ playbook_dir }}/kanye.dat"
      tags: system
      when: ansible_facts['os_family'] == "Darwin"

    - name: Install kanye fortune (Debian)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /usr/share/games/fortunes/
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/kanye"
        - "{{ playbook_dir }}/kanye.dat"
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Debian"

    - name: Install kanye fortune (Arch)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /usr/share/fortune/
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/kanye"
        - "{{ playbook_dir }}/kanye.dat"
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Archlinux"
