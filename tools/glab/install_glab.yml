---
- name: Install GitLab CLI (glab)
  hosts: all
  gather_facts: true

  vars:
    glab_version: "1.112.0"

  tasks:
    - name: Install glab via Homebrew (macOS)
      ansible.builtin.shell: /opt/homebrew/bin/brew install glab
      args:
        creates: /opt/homebrew/bin/glab
      when: ansible_facts['os_family'] == "Darwin"
      tags: system

    # Version-aware so bumping glab_version actually upgrades the host.
    - name: Check installed glab version (Debian)
      ansible.builtin.command: /usr/local/bin/glab --version
      register: glab_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Download and install glab (Debian)
      ansible.builtin.shell: |
        curl -fsSLo /tmp/glab.tar.gz \
          "https://gitlab.com/gitlab-org/cli/-/releases/v{{ glab_version }}/downloads/glab_{{ glab_version }}_linux_amd64.tar.gz"
        tar xf /tmp/glab.tar.gz -C /tmp bin/glab
        install /tmp/bin/glab /usr/local/bin/glab
        rm -rf /tmp/glab.tar.gz /tmp/bin
      become: true
      tags: system
      when: >-
        ansible_facts['os_family'] == "Debian"
        and ("glab " ~ glab_version ~ " ") not in (glab_installed.stdout | default(""))

    - name: Install glab via pacman (Arch)
      community.general.pacman:
        name: glab
        state: present
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Archlinux"
