- name: Install Go
  hosts: all
  gather_facts: true
  vars:
    go_version: "1.26.5"
    go_os_map:
      Darwin: darwin
      Debian: linux
      Archlinux: linux
    go_arch_map:
      x86_64: amd64
      aarch64: arm64
      # macOS reports Apple Silicon as arm64, Linux as aarch64. Both map to
      # Go's "arm64" release arch. Previously missing, which made this play
      # fail on Apple Silicon whenever Go actually needed installing.
      arm64: arm64
    go_os: "{{ go_os_map[ansible_facts.os_family] }}"
    go_arch: "{{ go_arch_map[ansible_facts.architecture] }}"
  tasks:
    # Version-aware, not existence-aware: bumping go_version must actually
    # upgrade the host. `go version` prints e.g. "go version go1.26.5 darwin/arm64";
    # the trailing space keeps go1.26.5 from matching a hypothetical go1.26.50.
    - name: Check installed Go version
      ansible.builtin.command: /usr/local/go/bin/go version
      register: go_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Determine whether Go needs installing
      ansible.builtin.set_fact:
        go_needed: "{{ 'go' ~ go_version ~ ' ' not in go_installed.stdout | default('') }}"
    # macOS: Use .pkg installer
    - name: Download Go installer (macOS)
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.{{ go_os }}-{{ go_arch }}.pkg"
        dest: /tmp/go.pkg
      when: ansible_facts['os_family'] == "Darwin" and go_needed
    - name: Install Go (macOS)
      ansible.builtin.command: installer -pkg /tmp/go.pkg -target /
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Darwin" and go_needed
    - name: Clean up installer (macOS)
      ansible.builtin.file:
        path: /tmp/go.pkg
        state: absent
      when: ansible_facts['os_family'] == "Darwin" and go_needed
    # Linux: Use tarball
    - name: Download Go tarball (Linux)
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.{{ go_os }}-{{ go_arch }}.tar.gz"
        dest: /tmp/go.tar.gz
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and go_needed
    - name: Install Go (Linux)
      ansible.builtin.shell: rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tar.gz
      become: true
      tags: system
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and go_needed
    - name: Clean up tarball (Linux)
      ansible.builtin.file:
        path: /tmp/go.tar.gz
        state: absent
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"] and go_needed
    - name: Add Go to shell config
      ansible.builtin.blockinfile:
        path: ~/.zshrc
        create: true
        marker: "# {mark} GO"
        block: |
          export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin
    - name: Install Go dev tools
      ansible.builtin.shell: |
        export PATH=$PATH:/usr/local/go/bin
        go install mvdan.cc/gofumpt@latest
        go install golang.org/x/tools/cmd/goimports@latest
        go install golang.org/x/tools/gopls@latest
      args:
        creates: ~/go/bin/gofumpt
