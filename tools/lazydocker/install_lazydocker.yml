- name: Install lazydocker
  hosts: all
  gather_facts: true

  vars:
    lazydocker_version: "0.25.2"

  tasks:
    - name: Install lazydocker via Homebrew
      ansible.builtin.shell: /opt/homebrew/bin/brew install lazydocker
      args:
        creates: /opt/homebrew/bin/lazydocker
      when: ansible_facts['os_family'] == "Darwin"
      tags: system
    # Version-aware so bumping lazydocker_version actually upgrades the host.
    - name: Check installed lazydocker version (Debian)
      ansible.builtin.command: /usr/local/bin/lazydocker --version
      register: lazydocker_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts['os_family'] == "Debian"
    - name: Download and install lazydocker (Debian)
      ansible.builtin.shell: |
        LAZYDOCKER_URL="https://github.com/jesseduffield/lazydocker/releases/download"
        curl -fLo /tmp/lazydocker.tar.gz "${LAZYDOCKER_URL}/v{{ lazydocker_version }}/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz"
        tar xf /tmp/lazydocker.tar.gz -C /tmp lazydocker
        install /tmp/lazydocker /usr/local/bin
        rm -f /tmp/lazydocker /tmp/lazydocker.tar.gz
      become: true
      tags: system
      when: >-
        ansible_facts['os_family'] == "Debian"
        and ("Version: " ~ lazydocker_version) not in (lazydocker_installed.stdout | default(""))
    - name: Install lazydocker via yay (Arch)
      ansible.builtin.shell: yay -S --noconfirm lazydocker
      args:
        creates: /usr/bin/lazydocker
      when: ansible_facts['os_family'] == "Archlinux"
      tags: system
    - name: Create zsh config directory
      ansible.builtin.file:
        path: ~/.config/zsh
        state: directory
    - name: Install lazydocker aliases
      ansible.builtin.copy:
        src: lazydocker.zsh
        dest: ~/.config/zsh/lazydocker.zsh
    - name: Source lazydocker aliases in zshrc
      ansible.builtin.lineinfile:
        path: ~/.zshrc
        line: source ~/.config/zsh/lazydocker.zsh
        create: true
    - name: Create lazydocker config directory
      ansible.builtin.file:
        path: ~/.config/lazydocker
        state: directory
    - name: Install lazydocker config
      ansible.builtin.copy:
        src: config.yml
        dest: ~/.config/lazydocker/config.yml
