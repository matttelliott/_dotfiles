---
- name: Install ncdu
  hosts: all
  gather_facts: true

  tasks:
    - name: Install ncdu via Homebrew (macOS)
      ansible.builtin.shell: /opt/homebrew/bin/brew install ncdu
      args:
        creates: /opt/homebrew/bin/ncdu
      when: ansible_facts['os_family'] == "Darwin"
      tags: system

    - name: Install ncdu via apt (Debian)
      ansible.builtin.apt:
        name: ncdu
        state: present
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Debian"

    - name: Install ncdu via pacman (Arch)
      community.general.pacman:
        name: ncdu
        state: present
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Archlinux"
