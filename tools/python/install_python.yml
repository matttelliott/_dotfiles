---
- name: Install uv (Python)
  hosts: all
  gather_facts: true

  vars:
    uv_version: "0.12.2"

  tasks:
    - name: Install uv via Homebrew
      ansible.builtin.shell: /opt/homebrew/bin/brew install uv
      args:
        creates: /opt/homebrew/bin/uv
      when: ansible_facts['os_family'] == "Darwin"
      tags: system

    # Version-aware so bumping uv_version actually upgrades the host.
    # `uv --version` prints e.g. "uv 0.12.2 (abc1234 2026-08-05)".
    - name: Check installed uv version (Linux)
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv --version"
      register: uv_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"]

    - name: Install uv via official installer (Linux)
      # Latest version: https://github.com/astral-sh/uv/releases
      ansible.builtin.shell: curl -LsSf https://astral.sh/uv/{{ uv_version }}/install.sh | sh
      changed_when: true
      when: >-
        ansible_facts['os_family'] in ["Debian", "Archlinux"]
        and ("uv " ~ uv_version ~ " ") not in (uv_installed.stdout | default(""))

    - name: Install Python dev tools (macOS)
      ansible.builtin.shell: /opt/homebrew/bin/uv tool install ruff && /opt/homebrew/bin/uv tool install black && /opt/homebrew/bin/uv tool install isort
      args:
        creates: ~/.local/bin/ruff
      when: ansible_facts['os_family'] == "Darwin"

    - name: Install Python dev tools (Linux)
      ansible.builtin.shell: ~/.local/bin/uv tool install ruff && ~/.local/bin/uv tool install black && ~/.local/bin/uv tool install isort
      args:
        creates: ~/.local/bin/ruff
      when: ansible_facts['os_family'] in ["Debian", "Archlinux"]
