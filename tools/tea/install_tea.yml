---
- name: Install Gitea/Forgejo CLI (tea)
  hosts: all
  gather_facts: true

  vars:
    tea_version: "0.15.1"

  tasks:
    - name: Install tea via Homebrew (macOS)
      ansible.builtin.shell: /opt/homebrew/bin/brew install tea
      args:
        creates: /opt/homebrew/bin/tea
      when: ansible_facts['os_family'] == "Darwin"
      tags: system

    # Version-aware so bumping tea_version actually upgrades the host.
    - name: Check installed tea version (Debian)
      ansible.builtin.command: /usr/local/bin/tea --version
      register: tea_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Download and install tea (Debian)
      ansible.builtin.shell: |
        curl -fsSLo /tmp/tea \
          https://dl.gitea.com/tea/{{ tea_version }}/tea-{{ tea_version }}-linux-amd64
        install /tmp/tea /usr/local/bin/tea
        rm -f /tmp/tea
      become: true
      tags: system
      when: >-
        ansible_facts['os_family'] == "Debian"
        and tea_version not in (tea_installed.stdout | default(""))

    - name: Install tea via pacman (Arch)
      community.general.pacman:
        name: tea
        state: present
      become: true
      tags: system
      when: ansible_facts['os_family'] == "Archlinux"
